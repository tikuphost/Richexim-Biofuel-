    <script>
      // 1. Automatically redirect to trailing slash on GitHub Pages subpaths
      // Prevents 404s when loading relative assets (./assets/...)
      (function() {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();

      // 2. Single Page Apps for GitHub Pages redirect decoder
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
